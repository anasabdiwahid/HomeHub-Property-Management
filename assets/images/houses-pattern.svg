<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" fill="none">
    <!-- House 1: Modern Villa Silhouette -->
    <path d="M10 90V45L35 25L60 45V90H10Z" stroke="#e5a93b" stroke-width="1.2" stroke-opacity="0.16" fill="rgba(229,169,59,0.015)" />
    <!-- Roofline overhang -->
    <path d="M5 47L35 22L65 47" stroke="#e5a93b" stroke-width="1.5" stroke-opacity="0.22" />
    <!-- Chimney / Vent -->
    <path d="M48 25V15H54V30" stroke="#e5a93b" stroke-width="1" stroke-opacity="0.14" />
    <!-- Door -->
    <path d="M28 90V65H42V90" stroke="#e5a93b" stroke-width="1" stroke-opacity="0.18" />
    <!-- Window 1 -->
    <rect x="18" y="52" width="10" height="10" rx="1.5" stroke="#e5a93b" stroke-width="1" stroke-opacity="0.15" />
    <rect x="42" y="52" width="10" height="10" rx="1.5" stroke="#e5a93b" stroke-width="1" stroke-opacity="0.15" />

    <!-- House 2: Contemporary Two-Story Apartment / Townhouse -->
    <path d="M68 90V35H112V90H68Z" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.12" fill="rgba(255,255,255,0.01)" />
    <!-- Flat Modern Roof Accent -->
    <path d="M64 35H116" stroke="#e5a93b" stroke-width="1.8" stroke-opacity="0.22" />
    <!-- Upper Balcony -->
    <rect x="74" y="44" width="14" height="12" rx="1" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.14" />
    <rect x="94" y="44" width="12" height="12" rx="1" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.14" />
    <!-- Lower Level Windows -->
    <rect x="74" y="66" width="14" height="14" rx="1" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.14" />
    <path d="M96 90V68H108V90" stroke="#e5a93b" stroke-width="1" stroke-opacity="0.16" />

    <!-- House 3: Sloped Roof Bungalow -->
    <path d="M118 90V55L142 35L158 50V90H118Z" stroke="#e5a93b" stroke-width="1.1" stroke-opacity="0.14" />
    <path d="M114 56L142 32L162 49" stroke="#e5a93b" stroke-width="1.3" stroke-opacity="0.2" />
    <rect x="126" y="62" width="10" height="10" rx="1" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.12" />

    <!-- Ground baseline connection -->
    <path d="M0 90H160" stroke="#e5a93b" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="3 3" />
</svg>
